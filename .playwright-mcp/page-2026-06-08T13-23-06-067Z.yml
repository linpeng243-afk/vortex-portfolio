      - paragraph [ref=e25]: 我是一位专注于AIGC领域的视觉设计师，擅长将人工智能技术与艺术创意深度融合。通过AI生成、数字合成、超现实场景构建等手法，为时尚杂志、品牌商业项目打造前所未有的视觉体验。
      - paragraph [ref=e26]: 作品多次刊登于《时尚芭莎》、《COSMOPOLITAN》、《时装L'OFFICIEL》、《新视线WONDERLAND》等顶级杂志，为多位知名艺人和品牌创造过令人难忘的视觉作品。
