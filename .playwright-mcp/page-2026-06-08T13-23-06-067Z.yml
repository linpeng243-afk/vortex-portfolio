    - generic [ref=e64]:
      - paragraph [ref=e65]: 意识与自然之间有一片无路大海。用AI构建一个由塑料垃圾构成的超现实海洋世界，在美丽的假象下，隐藏着对海洋污染的深刻警示。每年约1100万吨塑料进入海洋，到2050年，海洋中的塑料可能比鱼还多。
      - paragraph [ref=e66]: Between consciousness and nature lies an impassable ocean. Using AI to construct a surreal ocean world made of plastic waste, beneath the beautiful illusion lies a profound warning about ocean pollution. Every year, approximately 11 million metric tons of plastic enter the oceans.
